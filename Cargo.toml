[workspace]
members = ["crates/chem"]
resolver = "3"

[package]
name = "valence"
version = "0.1.0"
edition = "2024"
description = "Drag-and-drop 3D molecule builder"

[dependencies]
valence_chem = { path = "crates/chem" }
bevy = { version = "0.20.1" }
bevy_egui = "0.43.1"

# Fast iteration: optimize dependencies even in debug builds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
