[workspace]
members = ["crates/chem"]
resolver = "3"

[package]
name = "valence"
version = "0.1.0"
edition = "2024"
description = "Drag-and-drop 3D molecule builder"
rust-version = "1.95"
repository = "https://github.com/rallegretti/Valence"
license = "CC0-1.0"

[dependencies]
valence_chem = { path = "crates/chem", features = ["serde"] }
# Only the Bevy features we use: no audio, gamepad (needs libudev on Linux),
# glTF, scenes or bevy_ui. Fewer system deps = builds cleanly on every OS.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "bevy_window",
    "x11",
    "wayland",
    "keyboard",
    "mouse",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_camera",
    "bevy_light",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "png",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
# bevy_asset hashes with blake3; "pure" avoids its C/asm build step so no C
# compiler is needed on any platform (and cross-checks work from Linux).
blake3 = { version = "1.8", features = ["pure"] }
# Same wgpu as Bevy uses; only for probing GPU adapters at startup (gpu.rs).
wgpu = { version = "30.0.1", default-features = false }
# Same image crate as Bevy; used to crop and save exported PNGs.
image = { version = "0.25", default-features = false, features = ["png"] }
# Native open/save dialogs (Windows COM, macOS AppKit, Linux XDG portal; no GTK).
rfd = "0.17"
# Lab data files (.valence) are JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: compile shaders with Microsoft's DXC, linked into the exe. The
# default FXC compiler was far too slow on older GPUs (the window stayed black).
[target.'cfg(windows)'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["statically-linked-dxc"] }

# macOS: route the menu's Quit (Cmd+Q) through the unsaved-changes prompt.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

# Windows: the app icon and version info in the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

# Fast iteration: optimize dependencies even in debug builds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# Unwind (not abort) so the crash guard can catch a bug, roll the lab back
# and keep the app running.
panic = "unwind"

# Shipping build: `cargo build --profile dist`
[profile.dist]
inherits = "release"
lto = "fat"
strip = "debuginfo"
